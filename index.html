<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন ও রেজিস্ট্রেশন - MK Healthcare</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="brand-title">🏥 MK Healthcare</div>
        <div class="brand-subtitle">আপনার বিশ্বস্ত ডিজিটাল স্বাস্থ্য সেবা প্ল্যাটফর্ম</div>

        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('login')">লগইন</button>
            <button class="tab-btn" onclick="switchTab('register')">রেজিস্ট্রেশন</button>
        </div>

        <!-- লগইন ফর্ম -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>ইমেইল বা ফোন নম্বর</label>
                <input type="text" id="loginEmail" placeholder="আপনার ইমেইল বা ফোন দিন..." required>
            </div>
            <div class="form-group">
                <label>পাসওয়ার্ড</label>
                <div class="password-wrapper">
                    <input type="password" id="loginPassword" placeholder="পাসওয়ার্ড দিন..." required>
                    <span class="toggle-password" onclick="togglePasswordVisibility('loginPassword', this)">👁️</span>
                </div>
            </div>
            <div class="forgot-link" onclick="showForgotModal()">পাসওয়ার্ড ভুলে গেছেন?</div>
            <button type="auth-btn" class="auth-btn" style="width:100%;">লগইন করুন</button>
        </form>

        <!-- রেজিস্ট্রেশন ফর্ম (৬৪ জেলা ও ডাইনামিক উপজেলা ড্রপডাউন সহ) -->
        <form id="registerForm" onsubmit="handleRegister(event)" style="display: none;">
            <div class="form-group">
                <label>পূর্ণ নাম</label>
                <input type="text" id="regName" placeholder="আপনার নাম লিখুন..." required>
            </div>
            <div class="form-group">
                <label>ইমেইল বা ফোন নম্বর</label>
                <input type="text" id="regEmail" placeholder="ইমেইল বা ফোন দিন..." required>
            </div>
            
            <!-- ৬৪ জেলার সিলেক্ট ড্রপডাউন -->
            <div class="form-group">
                <label>জেলা নির্বাচন করুন (৬৪ জেলা)</label>
                <select id="regDistrict" onchange="loadUpazilas()" required>
                    <option value="">জেলা নির্বাচন করুন...</option>
                </select>
            </div>

            <!-- ডাইনামিক উপজেলা সিলেক্ট ড্রপডাউন -->
            <div class="form-group">
                <label>উপজেলা / থানা নির্বাচন করুন</label>
                <select id="regUpazila" required>
                    <option value="">প্রথমে জেলা নির্বাচন করুন...</option>
                </select>
            </div>

            <div class="form-group">
                <label>বয়স</label>
                <input type="number" id="regAge" placeholder="আপনার বয়স লিখুন..." min="0" max="120" required>
            </div>
            <div class="form-group">
                <label>পাসওয়ার্ড</label>
                <div class="password-wrapper">
                    <input type="password" id="regPassword" placeholder="শক্তিশালী পাসওয়ার্ড দিন..." required>
                    <span class="toggle-password" onclick="togglePasswordVisibility('regPassword', this)">👁️</span>
                </div>
            </div>
            <button type="submit" class="auth-btn register-submit">রেজিস্ট্রেশন সম্পন্ন করুন</button>
        </form>
    </div>

    <!-- পাসওয়ার্ড রিকভারি মোডাল -->
    <div id="forgotModal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3 style="color:#0077b6; margin-top:0;">🔐 পাসওয়ার্ড পুনরুদ্ধার</h3>
            <p style="font-size:13px; color:#666;">আপনার রেজিস্টার্ড ইমেইল বা ফোন নম্বরটি লিখুন:</p>
            <input type="text" id="forgotInput" placeholder="ইমেইল বা ফোন...">
            <button onclick="resetPassword()" class="auth-btn" style="margin-top:12px;">রিসেট করুন</button>
            <button onclick="closeForgotModal()" class="auth-btn" style="background:#d90429; margin-top:8px;">বাতিল</button>
        </div>
    </div>

    <!-- ডেটা ফাইল ও স্ক্রিপ্ট -->
    <script src="bangladesh-geo-data.js"></script>
    <script src="script.js"></script>
</body>
</html>
