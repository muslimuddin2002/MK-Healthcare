<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন ও রেজিস্ট্রেশন - MK Healthcare</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="brand-title">🏥 MK Healthcare</div>
        <p class="brand-subtitle">আপনার বিশ্বস্ত ডিজিটাল হেলথ প্ল্যাটফর্ম</p>
        
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('login')">লগইন</button>
            <button class="tab-btn" onclick="switchTab('register')">রেজিস্ট্রেশন</button>
        </div>

        <form id="loginForm" class="auth-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>ফোন নম্বর বা ইমেইল</label>
                <input type="text" id="loginEmail" placeholder="আপনার ফোন বা ইমেইল দিন" required>
            </div>
            <div class="form-group">
                <label>পাসওয়ার্ড</label>
                <div class="password-wrapper">
                    <input type="password" id="loginPassword" placeholder="পাসওয়ার্ড দিন" required>
                    <span class="toggle-password" onclick="togglePasswordVisibility('loginPassword', this)">👁️</span>
                </div>
            </div>
            <button type="submit" class="auth-btn">লগইন করুন</button>
            <p class="forgot-link" onclick="showForgotModal()">পাসওয়ার্ড ভুলে গেছেন?</p>
        </form>

        <form id="registerForm" class="auth-form" style="display: none;" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>পূর্ণ নাম</label>
                <input type="text" id="regName" placeholder="আপনার সম্পূর্ণ নাম" required>
            </div>
            <div class="form-group">
                <label>ফোন নম্বর বা ইমেইল</label>
                <input type="text" id="regEmail" placeholder="যোগাযোগের নম্বর বা ইমেইল" required>
            </div>
            <div class="form-group">
                <label>আপনার জেলা নির্বাচন করুন</label>
                <select id="regDistrict" required>
                    <option value="">জেলা সিলেক্ট করুন...</option>
                    <option value="ঢাকা">ঢাকা</option>
                    <option value="চট্টগ্রাম">চট্টগ্রাম</option>
                    <option value="রাজশাহী">রাজশাহী</option>
                    <option value="সিলেট">সিলেট</option>
                    <option value="খুলনা">খুলনা</option>
                    <option value="বরিশাল">বরিশাল</option>
                    <option value="রংপুর">রংপুর</option>
                    <option value="ময়মনসিংহ">ময়মনসিংহ</option>
                    <option value="কুমিল্লা">কুমিল্লা</option>
                    <option value="ফরিদপুর">ফরিদপুর</option>
                    <option value="বগুড়া">বগুড়া</option>
                    <option value="নোয়াখালী">নোয়াখালী</option>
                </select>
            </div>
            <div class="form-group">
                <label>আপনার উপজেলা লিখুন</label>
                <input type="text" id="regUpazila" placeholder="আপনার উপজেলার নাম" required>
            </div>
            <div class="form-group">
                <label>বয়স (বছর)</label>
                <input type="number" id="regAge" placeholder="আপনার বয়স লিখুন" required>
            </div>
            <div class="form-group">
                <label>নতুন পাসওয়ার্ড</label>
                <div class="password-wrapper">
                    <input type="password" id="regPassword" placeholder="শক্তিশালী পাসওয়ার্ড দিন" required>
                    <span class="toggle-password" onclick="togglePasswordVisibility('regPassword', this)">👁️</span>
                </div>
            </div>
            <button type="submit" class="auth-btn register-submit">একাউন্ট তৈরি করুন</button>
        </form>
    </div>

    <div id="forgotModal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3>🔑 পাসওয়ার্ড উদ্ধার</h3>
            <p>আপনার রেজিস্টার্ড ফোন নম্বর বা ইমেইল দিন:</p>
            <input type="text" id="forgotInput" placeholder="ফোন বা ইমেইল দিন">
            <button onclick="resetPassword()" class="auth-btn" style="margin-top:10px;">নতুন পাসওয়ার্ড সেট করুন</button>
            <button onclick="closeForgotModal()" class="back-btn" style="margin-top:5px; width:100%;">বাতিল</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
